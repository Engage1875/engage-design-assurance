# Deploys to Azure Static Web Apps.
#  - main (or a run by hand from the Actions tab on main) goes to the LIVE site. Only main does.
#  - dep-midp, the separate development line for Design Earned Progress and MIDP work, goes to
#    its own fixed preview site (Azure environment "depmidp"). It never touches the live site.
#  - A pull request into main or into dep-midp gets its own temporary preview site (Azure posts
#    its address on the pull request), removed when the pull request is closed or merged.
# It does nothing until the AZURE_STATIC_WEB_APPS_API_TOKEN secret has been added (see docs/SETUP_GUIDE.md).
name: Deploy to Azure
on:
  push:
    branches: [main, dep-midp]
  pull_request:
    branches: [main, dep-midp]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false
jobs:
  deploy:
    # previews only for pull requests from this repository (forks never get the secret)
    # a run by hand deploys only from main or dep-midp
    if: (github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dep-midp')) || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that Azure is set up
        id: ready
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No AZURE_STATIC_WEB_APPS_API_TOKEN secret yet, so nothing is deployed. See docs/SETUP_GUIDE.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == 'true'
        with: { node-version: "20" }
      - name: Build the app and put it inside the sign-in service
        if: steps.ready.outputs.go == 'true'
        run: |
          python3 tools/build.py
          mkdir -p api/app
          cp dist/Engage.html api/app/Engage.html
      - name: Test before deploying
        if: steps.ready.outputs.go == 'true'
        run: |
          npm ci && npx playwright install --with-deps chromium
          node --test --test-concurrency=1 tests/*.test.mjs
          (cd api && npm ci && npm test)
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        uses: Azure/static-web-apps-deploy@v1
        id: swa
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          skip_app_build: true
          production_branch: main
          # dep-midp has its own fixed preview site; empty means production (main) or a pull-request preview
          deployment_environment: ${{ github.event_name != 'pull_request' && github.ref_name == 'dep-midp' && 'depmidp' || '' }}
      - name: Show the address
        if: steps.ready.outputs.go == 'true'
        run: echo "Deployed to ${{ steps.swa.outputs.static_web_app_url }}" | tee -a "$GITHUB_STEP_SUMMARY"

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
