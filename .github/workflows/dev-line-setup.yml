# One-off setup for the separate DEP and MIDP development line (branch dep-midp).
# Runs only when this file changes on dep-midp. It never touches main or the live site.
#  1. Marks the v134 release with a tag (the commit that is live on main).
#  2. Checks that the AZURE_CREDENTIALS key can sign in to Azure, and lists what it can see
#     (names only, no keys or settings values are printed).
#  3. Gives the dep-midp preview site (Azure environment "depmidp") its own Storage account,
#     so its approved-users list and sign-in records are separate from the live site's, and
#     its own session secret, so a sign-in on one site is not valid on the other. Email sending
#     and the permanent administrators are copied from the live site.
name: Development line setup
on:
  push:
    branches: [dep-midp]
    paths: [.github/workflows/dev-line-setup.yml]
permissions:
  contents: write
concurrency:
  group: dev-line-setup
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag v134
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify refs/tags/v134 >/dev/null; then
            echo "v134 tag already exists at $(git rev-list -n1 v134)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
            git tag -a v134 4b7c3541edd6dbc7b62b2a62dca4402ebdf161b7 -m "ENGAGE v134 (live 26 Nov 2026)"
            git push origin v134
          fi
      - name: Sign in to Azure with the AZURE_CREDENTIALS key
        # The key may have Azure's "--sdk-auth is deprecated" warning pasted in front of it,
        # so only the {...} part is used. Nothing from the key is printed.
        env:
          CREDS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          python3 - <<'PY'
          import json, os, re, shlex, sys
          raw = os.environ.get('CREDS', '')
          i, j = raw.find('{'), raw.rfind('}')
          if i < 0 or j < i: sys.exit('AZURE_CREDENTIALS holds no {...} block')
          c = json.loads(raw[i:j+1])
          need = ['clientId', 'clientSecret', 'tenantId', 'subscriptionId']
          missing = [k for k in need if not c.get(k)]
          if missing: sys.exit('AZURE_CREDENTIALS is missing: ' + ', '.join(missing))
          for k in need:
              print('::add-mask::' + c[k])
              with open(os.environ['RUNNER_TEMP'] + '/sp.env', 'a') as f: f.write(f'{k.upper()}={shlex.quote(c[k])}\n')
          print('Text before the key: ' + ('yes, ignored' if raw[:i].strip() else 'none'), file=sys.stderr)
          PY
          . "$RUNNER_TEMP/sp.env"; rm -f "$RUNNER_TEMP/sp.env"
          az login --service-principal -u "$CLIENTID" -p "$CLIENTSECRET" --tenant "$TENANTID" -o none
          az account set -s "$SUBSCRIPTIONID"
          echo "Signed in to Azure."
      - name: What the key can see
        run: |
          az account show --query "{subscription:name, state:state}" -o table
          echo "--- resource groups"; az group list --query "[].{name:name, location:location}" -o table
          for g in $(az group list --query "[].name" -o tsv); do
            echo "--- resources in $g"; az resource list -g "$g" --query "[].{name:name, type:type, location:location}" -o table
          done
          echo "--- static web apps"; az staticwebapp list --query "[].{name:name, rg:resourceGroup, sku:sku.name, host:defaultHostname}" -o table
          for s in $(az staticwebapp list --query "[].name" -o tsv); do
            echo "--- environments of $s"; az staticwebapp environment list -n "$s" --query "[].{name:name, build:buildId, host:hostname, status:status}" -o table || true
            echo "--- setting names of $s (values not shown)"; az staticwebapp appsettings list -n "$s" --query "keys(properties)" -o tsv || true
          done
      - name: Separate storage and settings for the dep-midp preview site
        env:
          RG: rg-engage
          SWA: engage-design-assurance
          ENV_NAME: depmidp
          DEV_STORAGE: stengage1875dev
        run: |
          host=$(az staticwebapp environment list -n "$SWA" --query "[?name=='$ENV_NAME'].hostname | [0]" -o tsv)
          if [ -z "$host" ]; then echo "The $ENV_NAME preview site does not exist yet; deploy dep-midp first."; exit 1; fi
          echo "dep-midp preview site: https://$host"
          if ! az storage account show -g "$RG" -n "$DEV_STORAGE" -o none 2>/dev/null; then
            echo "Creating Storage account $DEV_STORAGE"
            az storage account create -g "$RG" -n "$DEV_STORAGE" -l uaenorth --sku Standard_LRS --kind StorageV2 \
              --min-tls-version TLS1_2 --allow-blob-public-access false --https-only true -o none
          else
            echo "Storage account $DEV_STORAGE already exists"
          fi
          conn=$(az storage account show-connection-string -g "$RG" -n "$DEV_STORAGE" --query connectionString -o tsv)
          echo "::add-mask::$conn"
          az staticwebapp appsettings list -n "$SWA" -o json > "$RUNNER_TEMP/live.json"
          existing=$(az staticwebapp appsettings list -n "$SWA" --environment-name "$ENV_NAME" -o json 2>/dev/null || echo '{}')
          python3 - "$RUNNER_TEMP/live.json" "$host" "$conn" "$existing" "$RUNNER_TEMP/args" <<'PY'
          import json, secrets, sys
          live = json.load(open(sys.argv[1])).get('properties', {})
          host, conn = sys.argv[2], sys.argv[3]
          try: old = json.loads(sys.argv[4]).get('properties', {}) or {}
          except Exception: old = {}
          keep = ['ADMIN_EMAILS', 'ACS_EMAIL_CONNECTION_STRING', 'ACS_EMAIL_SENDER', 'AUTH_ALLOWED_DOMAINS']
          out = {k: live[k] for k in keep if live.get(k)}
          out['ENGAGE_ALLOWED_ORIGIN'] = 'https://' + host
          out['ENGAGE_TABLES_CONNECTION'] = conn
          # keep an earlier dev secret if it is already separate, so dev sign-ins survive re-runs
          sec = old.get('SESSION_SECRET')
          out['SESSION_SECRET'] = sec if sec and sec != live.get('SESSION_SECRET') else secrets.token_urlsafe(48)
          print('::add-mask::' + out['SESSION_SECRET'])
          open(sys.argv[5], 'w').write('\n'.join(f'{k}={v}' for k, v in out.items()) + '\n')
          print('Settings for the preview site: ' + ', '.join(out))
          PY
          mapfile -t args < "$RUNNER_TEMP/args"; rm -f "$RUNNER_TEMP/args" "$RUNNER_TEMP/live.json"
          az staticwebapp appsettings set -n "$SWA" --environment-name "$ENV_NAME" --setting-names "${args[@]}" -o none
          echo "Preview site settings now: $(az staticwebapp appsettings list -n "$SWA" --environment-name "$ENV_NAME" --query 'keys(properties)' -o tsv | tr '\n' ' ')"
          echo "Live site settings unchanged: $(az staticwebapp appsettings list -n "$SWA" --query 'keys(properties)' -o tsv | tr '\n' ' ')"
